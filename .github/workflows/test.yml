name: Test CI
on:
  pull_request:
  push:
    branches-ignore:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install deps
        run: pnpm install

      - name: Lint, type-check and test
        run: pnpm run ci

      - name: Build
        run: pnpm run build

      - name: Smoke test CLIs
        run: pnpm run smoke
